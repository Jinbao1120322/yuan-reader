name: Build Unsigned iOS IPA

on:
  # 只保留手动触发：deploy.js 更新 main 后会用 workflow_dispatch 触发。
  # 同时开 push 会让每次部署跑两个 job（push + dispatch），双倍消耗 macOS 配额
  # （私有仓库 macOS runner 按 10 倍计费）。
  workflow_dispatch:

jobs:
  build-ipa:
    # 必须用 macOS 15（默认 Xcode 16.4 / iOS 18.5 SDK）。
    # 原因：iOS 26 起，链接 iOS 26 SDK 的 App 强制要求 UIScene 生命周期，
    # RN 0.79 尚未支持 → 在 iOS 26 真机上启动即白屏。用 iOS 18 SDK 链接可规避。
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4 (iOS 18 SDK)
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version
          echo "--- iphoneos SDKs ---"
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read version from app.json
        id: ver
        run: |
          VER=$(node -e "console.log(require('./app.json').expo.version)")
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Expo prebuild (generate iOS native project + pods)
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: npx expo prebuild --platform ios --no-install

      # 原生探针 + 诊断信息
      # 把 window 背景改成品红色：如果 JS 连引擎都没跑起来（React 什么都没渲染），
      # 屏幕上看到的就是品红而不是纯白。这样一次装机即可区分「JS 挂了」和
      # 「React 渲染成空」，不必再靠猜。App 正常时这个背景会被完全覆盖，看不出来。
      # 同时把 AppDelegate 全文打进日志，便于核对根视图装配方式。
      - name: Native probe (magenta window) and dump AppDelegate
        run: |
          set +e
          f=$(find ios -maxdepth 4 \( -name 'AppDelegate.swift' -o -name 'AppDelegate.mm' \) | head -n1)
          echo "AppDelegate path: ${f:-<not found>}"
          if [ -z "$f" ]; then echo "WARN: AppDelegate not found, skip probe"; exit 0; fi
          echo "----- AppDelegate BEGIN -----"
          cat "$f"
          echo "----- AppDelegate END -----"
          cp "$f" "$f.bak"
          if grep -q 'UIWindow(frame:' "$f"; then
            perl -0pi -e 's/(window = UIWindow\(frame:[^\n]*\n)/$1    window?.backgroundColor = UIColor.magenta\n/' "$f"
            echo "swift patched: $(grep -c 'UIColor.magenta' "$f")"
          elif grep -q 'UIWindow alloc' "$f"; then
            perl -0pi -e 's/(self\.window = \[\[UIWindow alloc\][^\n]*\n)/$1  self.window.backgroundColor = [UIColor magentaColor];\n/' "$f"
            echo "objc patched: $(grep -c 'magentaColor' "$f")"
          else
            echo "WARN: no known UIWindow pattern, keep original"
            cp "$f.bak" "$f"
          fi
          if cmp -s "$f" "$f.bak"; then echo "PROBE: not applied"; else echo "PROBE: applied"; fi
          exit 0

      - name: Patch Podfile (fmt c++17 for Xcode 26 clang) and install pods
        run: |
          cd ios
          ruby ../scripts/fix_podfile.rb Podfile
          pod install

      - name: Build unsigned archive
        run: |
          cd ios
          set -e
          WS=$(find . -maxdepth 1 -name '*.xcworkspace' | head -n1)
          WS_NAME=$(basename "$WS")
          echo "Detected workspace: $WS_NAME"
          if [ -z "$WS_NAME" ]; then
            echo "ERROR: no .xcworkspace found in $(pwd)"; ls -la; exit 1
          fi
          SCHEME=$(xcodebuild -list -workspace "$WS_NAME" 2>/dev/null | awk '/Schemes:/{f=1;next} f && NF{print $1; exit}')
          echo "Detected scheme: $SCHEME"
          if [ -z "$SCHEME" ]; then
            echo "ERROR: no scheme found"; xcodebuild -list -workspace "$WS_NAME"; exit 1
          fi
          xcodebuild \
            -workspace "$WS_NAME" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath build/App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package unsigned IPA
        run: |
          cd ios
          set -e
          APP=$(find build/App.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -n1)
          echo "Found app bundle: $APP"
          if [ -z "$APP" ]; then
            echo "ERROR: no .app found in archive"; ls -la build/App.xcarchive/Products/Applications 2>/dev/null || true; exit 1
          fi
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          # 在 ios/ 内 zip，保证 ipa 结构是 Payload/app.app；输出到仓库根目录
          zip -r "../yuan-reader-v${{ steps.ver.outputs.version }}.ipa" Payload
          ls -lh "../yuan-reader-v${{ steps.ver.outputs.version }}.ipa"

      - name: Assert built against iOS 18 SDK (guard against UIScene white screen)
        run: |
          set -e
          APP=$(find ios/build/App.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -n1)
          echo "app bundle: $APP"
          SDK=$(/usr/libexec/PlistBuddy -c "Print :DTSDKName" "$APP/Info.plist")
          echo "DTSDKName = $SDK"
          case "$SDK" in
            iphoneos18.*|iphoneos17.*|iphoneos16.*)
              echo "OK: linked against pre-iOS26 SDK, no UIScene requirement on iOS 26 devices"
              ;;
            *)
              echo "ERROR: 链接到 $SDK —— iOS 26 会强制 UIScene，RN 0.79 不支持，真机必白屏。"
              echo "请确认 Xcode 已切到 16.4（iOS 18 SDK）。"
              exit 1
              ;;
          esac

          echo "--- 校验 JS bundle 确实包含本次引导层改动 ---"
          BUNDLE=$(find ios/build/App.xcarchive/Products/Applications -maxdepth 2 -name 'main.jsbundle' | head -n1)
          echo "bundle: $BUNDLE"
          if [ -z "$BUNDLE" ]; then echo "ERROR: main.jsbundle 不存在"; exit 1; fi
          if grep -aq '#ff9500' "$BUNDLE"; then
            echo "OK: bundle 含 v1.0.3 引导层探针色，确认新代码已打进包"
          else
            echo "ERROR: bundle 不含引导层探针色 #ff9500 —— 打包用的是旧 index.js"
            exit 1
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: yuan-reader-unsigned-v${{ steps.ver.outputs.version }}
          path: yuan-reader-v${{ steps.ver.outputs.version }}.ipa
